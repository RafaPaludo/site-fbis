fbis:
  title: O que é o FBIS?
  description: O mundo do trabalho está mudando. O movimento sindical também.
  paragraph:
    - A ideia do 1º Fórum Brasileiro de Inovação Sindical surgiu da necessidade de promover um diálogo entre diferentes sindicatos, categorias e níveis, em conjunto com assessorias e de forma aberta à sociedade.
    - O fórum tem como base a experiência e a reflexão do professor José Roberto Paludo, presidente do Instituto Política Boa, em parceria com Giuliano Salvarani, da Baila Politics.
  images:
    - src: /images/fbis_section/fbis_section_1.jpg
      alt: Participantes reunidos durante o FBIS
    - src: /images/fbis_section/fbis_section_2.jpg
      alt: Público acompanhando uma atividade do FBIS
