seo:
  title: FBIS 2027 — Fórum Brasileiro de Inovação Sindical
  description: O FBIS 2027 reúne lideranças e organizações sindicais em Brasília para discutir inovação, transformação e os novos desafios do movimento sindical.

title: "O futuro do movimento sindical começa aqui"
description: Um encontro nacional que reúne organizações e lideranças para compartilhar experiências, discutir inovação e construir novos caminhos para o movimento sindical.

