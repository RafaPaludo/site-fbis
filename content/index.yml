fbis:
  title: O que é o FBIS?
  description: O mundo do trabalho está mudando. O movimento sincidal também.
  paragraph: "Novas tecnologias, novas formas de comunicação e transformações na sociedade estão criando desafios — e oportunidades — para as organizações sindicais. O FBIS nasceu para aproximar pessoas e organizações que querem entender essas mudanças, compartilhar experiências e construir novos caminhos para a atuação sindical. Mais do que um evento, um espaço de encontro, troca e transformação."
  image:
    src: https://images.unsplash.com/photo-1492684223066-81342ee5ff30?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8ZXZlbnRvc3xlbnwwfHwwfHx8MA%3D%3D
    alt: FBIS 2027

whyParticipate:
  title: Por que participar?
  description: Dois dias para sair da rotina, encontrar novas perspectivas e transformar ideias em possibilidades para sua organização.
  items:
    - label: Amplie suas perspectivas
      description: Conheça novas ideias, tendências e experiências que podem ajudar sua organização a compreender as transformações do mundo do trabalho e da atuação sindical.
    - label: Conecte-se com quem está fazendo
      description: Encontre dirigentes, profissionais, especialistas e organizações de diferentes regiões para trocar experiências, compartilhar desafios e criar novas conexões.
    - label: Leve novas ideias para sua organização
      description: Descubra práticas, experiências e possibilidades que podem inspirar novos projetos, iniciativas e formas de atuação dentro da sua organização.

