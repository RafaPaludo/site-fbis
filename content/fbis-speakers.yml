fbisSpeakers:
  title: Quem estará no FBIS 2027
  description: Perfis de palestrantes em definição, com diferentes perspectivas sobre o futuro do trabalho e do movimento sindical.
  speakers:
    - name: 'Liderança sindical'
      bio: >-
        Atua na representação de trabalhadores e na construção de pautas coletivas. Compartilha os desafios cotidianos da organização sindical. Contribui com caminhos para fortalecer a participação e a defesa de direitos.
    - name: 'Pesquisadora do mundo do trabalho'
      bio: >-
        Investiga as transformações nas relações de trabalho e seus efeitos sobre a vida profissional. Aproxima pesquisa, políticas públicas e realidade das categorias. Traz evidências para qualificar o debate e apoiar novas estratégias.
    - name: 'Especialista em negociação coletiva'
      bio: >-
        Atua em processos de diálogo e negociação entre trabalhadores e organizações. Reúne experiência em mediação de conflitos e construção de acordos. Apresenta práticas que ajudam a fortalecer a atuação coletiva.
